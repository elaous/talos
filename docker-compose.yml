# Run talos in a container:
#
#   make docker-up                      # creates ./pdfs and ./data, builds, starts on http://127.0.0.1:8080
#
# By default it talks to an Ollama running on the host (which must listen on more than loopback:
# OLLAMA_HOST=0.0.0.0). To run Ollama in a container too:
#
#   OLLAMA_URL=http://ollama:11434 docker compose --profile ollama up --build
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct && docker compose exec ollama ollama pull nomic-embed-text
#
# gojiberry (the UI framework, a private sibling module) is a named build context; point GOJIBERRY_DIR at it
# if it is not ../gojiberry.

services:
  talos:
    build:
      context: .
      additional_contexts:
        gojiberry: ${GOJIBERRY_DIR:-../gojiberry}
    image: talos:local
    # Only this machine can reach it: talos has no login. Put it behind something that authenticates before
    # publishing it further (and add the names you use to TALOS_ALLOWED_HOSTS).
    ports:
      - "127.0.0.1:8080:8080"
    # Run as the owner of ./pdfs and ./data so uploads and the index can be written (make docker-up sets these).
    user: "${TALOS_UID:-1000}:${TALOS_GID:-1000}"
    volumes:
      - ./pdfs:/pdfs
      - ./data:/data
      # - ./talos.docker.json:/etc/talos/talos.json:ro   # your own settings (see docker/talos.json)
    environment:
      TALOS_LLM_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      TALOS_EMBED_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # TALOS_LLM_MODEL: qwen2.5:7b-instruct
      # TALOS_EMBED_MODEL: nomic-embed-text
      # TALOS_ALLOWED_HOSTS: talos.lan
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # GPU: add `gpus: all` (NVIDIA container toolkit) or the device mapping your GPU needs.

volumes:
  ollama:
