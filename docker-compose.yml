services:
  talos:
    build:
      context: .
    image: talos:local
    # Loopback binding is the only protection: talos has no login.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - talos-pdfs:/pdfs
      - talos-data:/data
    environment:
      TALOS_LLM_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      TALOS_EMBED_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.40.15
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  talos-pdfs:
  talos-data:
  ollama:
