name: PR tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targeted-tests:
    name: Targeted tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out talos
        uses: actions/checkout@v7
        with:
          path: talos
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: talos/go.sum

      - name: Test changed packages
        working-directory: talos
        env:
          BASE: origin/${{ github.base_ref }}
        run: scripts/targeted-tests.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out talos
        uses: actions/checkout@v7
        with:
          path: talos
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: talos/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: talos

  generated:
    name: Generated code is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out talos
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Regenerate and compare
        run: |
          make generate
          git diff --exit-code
