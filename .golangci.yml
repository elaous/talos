version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - os.Remove
        - os.RemoveAll
        - (net/http.ResponseWriter).Write
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
      - path: _test\.go
        text: ST1018
formatters:
  enable:
    - gofmt
