<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talos</title>
  <style>
    :root { --bg:#fafaf9; --fg:#1c1917; --mut:#78716c; --line:#e7e5e4; --card:#fff; --acc:#b45309; --acc-fg:#fff; --user:#fef3c7; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1c1917; --fg:#f5f5f4; --mut:#a8a29e; --line:#44403c; --card:#292524; --acc:#f59e0b; --acc-fg:#1c1917; --user:#44331a; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
    .app { display:grid; grid-template-columns: 1fr 300px; gap:16px; max-width:1100px; margin:0 auto; padding:16px; min-height:100vh; }
    @media (max-width: 800px) { .app { grid-template-columns: 1fr; } }
    h1 { margin:0 0 8px; font-size:20px; } h2 { margin:0 0 8px; font-size:15px; color:var(--mut); font-weight:600; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
    .chat { display:flex; flex-direction:column; gap:10px; }
    .msg { padding:10px 12px; border-radius:10px; white-space:pre-wrap; overflow-wrap:anywhere; border:1px solid var(--line); }
    .msg.user { background:var(--user); align-self:flex-end; max-width:85%; }
    .msg.assistant { background:var(--card); }
    .msg.error { border-color:#dc2626; color:#dc2626; }
    .trace { font-size:13px; color:var(--mut); }
    .trace summary { cursor:pointer; }
    .step { margin:4px 0; overflow-wrap:anywhere; } .step b { color:var(--fg); }
    .step .txt { display:block; white-space:pre-wrap; max-height:6em; overflow:auto; }
    .composer { display:flex; gap:8px; align-items:flex-end; }
    textarea { flex:1; min-height:3.2em; resize:vertical; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; }
    button { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
    button.primary { background:var(--acc); color:var(--acc-fg); border-color:var(--acc); }
    button:disabled { opacity:.5; cursor:default; }
    button:focus-visible, textarea:focus-visible, input:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
    ul.docs { list-style:none; margin:0 0 12px; padding:0; font-size:14px; }
    ul.docs li { display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
    .mut { color:var(--mut); font-size:13px; }
    form.up { display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  </style>
  <script src="wasm_exec.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((r) => go.run(r.instance));
  </script>
</body>
</html>
